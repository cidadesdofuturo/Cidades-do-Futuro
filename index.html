<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace de GovTechs — Cidades do Futuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --azul: #0A2342;
    --azul-medio: #1B4F8A;
    --azul-claro: #3B82C4;
    --ouro: #F5A623;
    --ouro-claro: #FDE9BC;
    --verde: #1DB878;
    --cinza-bg: #F0F4F9;
    --cinza-borda: #D1DCE8;
    --branco: #FFFFFF;
    --texto: #1A2E44;
    --texto-leve: #5E7896;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Space Grotesk', sans-serif; background: var(--cinza-bg); color: var(--texto); line-height: 1.6; }

  /* ── HEADER ── */
  header {
    background: var(--azul);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    height: 68px;
    position: sticky; top: 0; z-index: 1000;
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
  }
  .logo-badge {
    background: var(--ouro);
    color: var(--azul);
    font-weight: 700;
    font-size: .7rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: .35rem .7rem;
    border-radius: 4px;
  }
  header h1 { color: var(--branco); font-size: 1.15rem; font-weight: 600; }
  header p { color: rgba(255,255,255,.55); font-size: .78rem; font-family: 'DM Mono', monospace; }
  .header-right { margin-left: auto; display: flex; gap: .8rem; align-items: center; }
  .stat-pill {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2);
    color: var(--branco);
    font-size: .75rem;
    padding: .3rem .75rem;
    border-radius: 999px;
    font-family: 'DM Mono', monospace;
  }
  .stat-pill strong { color: var(--ouro); }

  /* ── MAP SECTION ── */
  .map-section {
    display: grid;
    grid-template-columns: 1fr 300px;
    height: 520px;
    border-bottom: 3px solid var(--ouro);
  }
  #map { width: 100%; height: 100%; }
  .map-sidebar {
    background: var(--azul);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-header {
    padding: 1.2rem 1.2rem .8rem;
    border-bottom: 1px solid rgba(255,255,255,.1);
  }
  .sidebar-header h3 {
    color: var(--branco);
    font-size: .85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: .6rem;
  }
  .sol-filter-input {
    width: 100%;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 6px;
    color: var(--branco);
    padding: .5rem .75rem;
    font-size: .85rem;
    font-family: 'Space Grotesk', sans-serif;
    outline: none;
  }
  .sol-filter-input::placeholder { color: rgba(255,255,255,.4); }
  .sol-filter-input:focus { border-color: var(--ouro); }
  .sol-list { overflow-y: auto; flex: 1; padding: .6rem; }
  .sol-tag {
    display: block;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 6px;
    color: rgba(255,255,255,.85);
    font-size: .8rem;
    padding: .5rem .8rem;
    cursor: pointer;
    margin-bottom: .4rem;
    transition: all .18s;
    user-select: none;
  }
  .sol-tag:hover, .sol-tag.active {
    background: var(--ouro);
    border-color: var(--ouro);
    color: var(--azul);
    font-weight: 600;
  }
  .sol-tag .count {
    float: right;
    font-family: 'DM Mono', monospace;
    font-size: .7rem;
    opacity: .7;
  }
  .sol-tag.active .count { opacity: 1; }
  .btn-clear {
    margin: .6rem;
    width: calc(100% - 1.2rem);
    background: none;
    border: 1px dashed rgba(255,255,255,.25);
    border-radius: 6px;
    color: rgba(255,255,255,.5);
    font-size: .78rem;
    padding: .45rem;
    cursor: pointer;
    font-family: 'Space Grotesk', sans-serif;
    transition: all .18s;
  }
  .btn-clear:hover { border-color: var(--ouro); color: var(--ouro); }

  /* ── POPUP ── */
  .leaflet-popup-content-wrapper {
    border-radius: 10px !important;
    box-shadow: 0 8px 32px rgba(0,0,0,.2) !important;
    border: none !important;
    padding: 0 !important;
    overflow: hidden;
  }
  .leaflet-popup-content { margin: 0 !important; width: 300px !important; }
  .popup-header {
    background: var(--azul);
    color: var(--branco);
    padding: .9rem 1rem .7rem;
  }
  .popup-header .mun { font-size: .7rem; color: var(--ouro); text-transform: uppercase; letter-spacing: .1em; font-family: 'DM Mono', monospace; }
  .popup-header .sol-name { font-size: 1.05rem; font-weight: 700; }
  .popup-body { padding: .85rem 1rem; background: var(--branco); }
  .popup-row { display: flex; justify-content: space-between; align-items: center; padding: .3rem 0; border-bottom: 1px solid #f0f0f0; font-size: .82rem; }
  .popup-row:last-child { border-bottom: none; }
  .popup-row .label { color: var(--texto-leve); }
  .popup-row .val { font-weight: 600; color: var(--texto); font-family: 'DM Mono', monospace; font-size: .8rem; }
  .popup-tipo { display: inline-block; font-size: .68rem; padding: .2rem .55rem; border-radius: 999px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; }
  .tipo-tec { background: #DBEAFE; color: #1E40AF; }
  .avaliado-badge { display: inline-flex; align-items: center; gap: .3rem; font-size: .72rem; font-weight: 600; color: var(--verde); }
  /* rating section */
  .popup-rating { margin-top: .6rem; padding: .7rem; background: var(--cinza-bg); border-radius: 8px; }
  .popup-rating .rating-title { font-size: .72rem; color: var(--texto-leve); text-transform: uppercase; letter-spacing: .06em; margin-bottom: .4rem; }
  .stars { display: flex; gap: 2px; margin-bottom: .4rem; }
  .star { font-size: 1rem; color: #E5E7EB; }
  .star.on { color: #F5A623; }
  .media-val { font-family: 'DM Mono', monospace; font-weight: 700; color: var(--azul); font-size: 1rem; }
  .sub-notas { display: grid; grid-template-columns: 1fr 1fr; gap: .25rem; margin-bottom: .5rem; }
  .sub-nota { font-size: .7rem; color: var(--texto-leve); }
  .sub-nota strong { color: var(--texto); }
  .depoimento-block { font-size: .76rem; color: var(--texto); line-height: 1.5; font-style: italic; max-height: 80px; overflow-y: auto; padding-right: .2rem; border-left: 3px solid var(--ouro); padding-left: .5rem; margin-top: .4rem; }

  /* ── CATALOG SECTION ── */
  .catalog-section { padding: 2.5rem 2rem; max-width: 1400px; margin: 0 auto; }
  .catalog-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap; }
  .catalog-header h2 { font-size: 1.5rem; font-weight: 700; color: var(--azul); }
  .catalog-header p { font-size: .85rem; color: var(--texto-leve); }
  .filters-bar {
    display: flex;
    gap: .75rem;
    flex-wrap: wrap;
    align-items: center;
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: 10px;
    padding: .85rem 1.2rem;
    margin-bottom: 1.5rem;
  }
  .filters-bar label { font-size: .78rem; color: var(--texto-leve); font-weight: 500; }
  .filter-select, .filter-input {
    border: 1px solid var(--cinza-borda);
    border-radius: 6px;
    background: var(--cinza-bg);
    color: var(--texto);
    padding: .4rem .75rem;
    font-size: .82rem;
    font-family: 'Space Grotesk', sans-serif;
    outline: none;
    cursor: pointer;
    transition: border-color .15s;
  }
  .filter-select:focus, .filter-input:focus { border-color: var(--azul-claro); }
  .filter-input { width: 220px; }
  .filter-count {
    margin-left: auto;
    font-size: .78rem;
    font-family: 'DM Mono', monospace;
    color: var(--texto-leve);
  }
  .filter-count strong { color: var(--azul-medio); }

  /* ── GRID ── */
  .sol-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1.25rem;
  }
  .sol-card {
    background: var(--branco);
    border: 1px solid var(--cinza-borda);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform .18s, box-shadow .18s;
  }
  .sol-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(10,35,66,.12); }
  .card-top {
    background: var(--azul);
    padding: 1.1rem 1.2rem .9rem;
    position: relative;
  }
  .card-dim {
    font-size: .65rem;
    font-family: 'DM Mono', monospace;
    color: var(--ouro);
    text-transform: uppercase;
    letter-spacing: .12em;
    margin-bottom: .35rem;
  }
  .card-nome { font-size: 1.05rem; font-weight: 700; color: var(--branco); }
  .card-topico {
    position: absolute;
    top: 1rem; right: 1rem;
    font-size: .65rem;
    background: rgba(255,255,255,.12);
    color: rgba(255,255,255,.75);
    padding: .2rem .55rem;
    border-radius: 999px;
    font-weight: 500;
  }
  .card-body { padding: 1rem 1.2rem; flex: 1; display: flex; flex-direction: column; gap: .7rem; }
  .card-desc { font-size: .82rem; color: var(--texto-leve); line-height: 1.55; flex: 1; }
  .card-impacto {
    font-size: .8rem;
    color: var(--texto);
    background: var(--ouro-claro);
    border-left: 3px solid var(--ouro);
    padding: .5rem .7rem;
    border-radius: 0 6px 6px 0;
    line-height: 1.45;
  }
  .card-impacto strong { display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: #A0620A; margin-bottom: .15rem; }
  .card-links { display: flex; gap: .6rem; flex-wrap: wrap; }
  .card-link {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    font-size: .75rem;
    font-weight: 600;
    text-decoration: none;
    padding: .35rem .75rem;
    border-radius: 6px;
    transition: all .15s;
  }
  .card-link.site { background: #EBF4FF; color: var(--azul-medio); border: 1px solid #BCD9F5; }
  .card-link.video { background: #FEE2E2; color: #DC2626; border: 1px solid #FECACA; }
  .card-link:hover { filter: brightness(.93); }
  .card-muns {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem;
    margin-top: .2rem;
  }
  .mun-chip {
    font-size: .7rem;
    background: #EDF2F9;
    color: var(--azul-medio);
    border-radius: 4px;
    padding: .15rem .5rem;
    font-weight: 500;
  }
  .card-footer {
    padding: .7rem 1.2rem;
    border-top: 1px solid var(--cinza-borda);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #FAFCFE;
  }
  .dim-badge {
    font-size: .68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .07em;
    padding: .2rem .55rem;
    border-radius: 999px;
  }
  .dim-economica { background: #D1FAE5; color: #065F46; }
  .dim-institucional { background: #DBEAFE; color: #1E40AF; }
  .dim-sociocultural { background: #EDE9FE; color: #5B21B6; }
  .dim-ambiente { background: #D1FAE5; color: #14532D; background: #DCFCE7; }
  .dim-outro { background: #F3F4F6; color: #374151; }
  .muns-label { font-size: .72rem; color: var(--texto-leve); font-family: 'DM Mono', monospace; }

  /* ── LEGEND MAP ── */
  .map-legend {
    position: absolute;
    bottom: 30px;
    left: 10px;
    background: white;
    border-radius: 8px;
    padding: .6rem .8rem;
    font-size: .72rem;
    z-index: 1000;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    pointer-events: none;
    border: 1px solid var(--cinza-borda);
  }
  .legend-item { display: flex; align-items: center; gap: .45rem; margin-bottom: .25rem; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

  /* ── EMPTY STATE ── */
  .empty-state { text-align: center; padding: 3rem; color: var(--texto-leve); font-size: .9rem; }
  .empty-state div { font-size: 2rem; margin-bottom: .5rem; }

  /* scrollbar */
  .sol-list::-webkit-scrollbar { width: 4px; }
  .sol-list::-webkit-scrollbar-track { background: transparent; }
  .sol-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.2); border-radius: 4px; }

  /* ── MODAL OVERLAY ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8, 20, 40, 0.72);
    backdrop-filter: blur(4px);
    z-index: 9000;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    overflow-y: auto;
  }
  .modal-overlay.open { display: flex; }

  .modal-box {
    background: var(--branco);
    border-radius: 16px;
    width: 100%;
    max-width: 880px;
    max-height: 92vh;
    overflow-y: auto;
    box-shadow: 0 24px 80px rgba(0,0,0,.45);
    animation: modalIn .22s cubic-bezier(.22,1,.36,1);
    display: flex;
    flex-direction: column;
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(28px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-head {
    background: var(--azul);
    padding: 1.6rem 1.8rem 1.3rem;
    position: relative;
    border-radius: 16px 16px 0 0;
    flex-shrink: 0;
  }
  .modal-head .m-eye { font-size: .68rem; font-family: 'DM Mono', monospace; color: var(--ouro); text-transform: uppercase; letter-spacing: .14em; margin-bottom: .4rem; }
  .modal-head h2 { color: var(--branco); font-size: 1.5rem; font-weight: 700; line-height: 1.2; }
  .modal-head .m-topico {
    display: inline-block;
    margin-top: .55rem;
    font-size: .72rem;
    background: rgba(255,255,255,.13);
    color: rgba(255,255,255,.8);
    padding: .25rem .65rem;
    border-radius: 999px;
    font-weight: 500;
  }
  .modal-close {
    position: absolute;
    top: 1.1rem; right: 1.2rem;
    background: rgba(255,255,255,.12);
    border: none;
    color: var(--branco);
    font-size: 1.1rem;
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
    line-height: 1;
  }
  .modal-close:hover { background: rgba(255,255,255,.25); }

  .modal-body { padding: 0; flex: 1; overflow-y: auto; }

  /* tabs */
  .modal-tabs {
    display: flex;
    border-bottom: 2px solid var(--cinza-borda);
    background: var(--branco);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .modal-tab {
    padding: .85rem 1.4rem;
    font-size: .82rem;
    font-weight: 600;
    color: var(--texto-leve);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: all .15s;
    user-select: none;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    font-family: 'Space Grotesk', sans-serif;
  }
  .modal-tab:hover { color: var(--azul-medio); }
  .modal-tab.active { color: var(--azul); border-bottom-color: var(--ouro); }

  .modal-panel { display: none; padding: 1.6rem 1.8rem; }
  .modal-panel.active { display: block; }

  /* info panel */
  .modal-desc { font-size: .9rem; color: var(--texto); line-height: 1.7; margin-bottom: 1.2rem; }
  .modal-impacto {
    background: var(--ouro-claro);
    border-left: 4px solid var(--ouro);
    padding: .9rem 1rem;
    border-radius: 0 8px 8px 0;
    margin-bottom: 1.2rem;
  }
  .modal-impacto .mi-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: #92600A; margin-bottom: .3rem; }
  .modal-impacto p { font-size: .88rem; color: var(--texto); line-height: 1.55; }
  .modal-links { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.4rem; }
  .modal-link {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    text-decoration: none;
    padding: .5rem 1rem;
    border-radius: 8px;
    font-size: .83rem;
    font-weight: 600;
    transition: filter .15s;
  }
  .modal-link.site { background: #EBF4FF; color: var(--azul-medio); border: 1px solid #BCD9F5; }
  .modal-link.video { background: #FEE2E2; color: #DC2626; border: 1px solid #FECACA; }
  .modal-link:hover { filter: brightness(.92); }

  .modal-stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .8rem;
    margin-bottom: 1.4rem;
  }
  .modal-stat {
    background: var(--cinza-bg);
    border: 1px solid var(--cinza-borda);
    border-radius: 10px;
    padding: .9rem 1rem;
    text-align: center;
  }
  .modal-stat .ms-val { font-size: 1.5rem; font-weight: 700; color: var(--azul); font-family: 'DM Mono', monospace; }
  .modal-stat .ms-lbl { font-size: .7rem; color: var(--texto-leve); text-transform: uppercase; letter-spacing: .07em; margin-top: .2rem; }

  /* map panel */
  #modal-map { width: 100%; height: 360px; border-radius: 10px; overflow: hidden; border: 1px solid var(--cinza-borda); }
  .modal-mun-list { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1rem; }
  .modal-mun-chip {
    font-size: .78rem;
    background: #EDF2F9;
    color: var(--azul-medio);
    border-radius: 6px;
    padding: .3rem .65rem;
    font-weight: 500;
    display: flex; align-items: center; gap: .3rem;
  }
  .modal-mun-chip.avaliado { background: #FEF3C7; color: #92600A; }

  /* depoimentos panel */
  .depo-card {
    background: var(--cinza-bg);
    border: 1px solid var(--cinza-borda);
    border-radius: 12px;
    padding: 1.2rem 1.3rem;
    margin-bottom: 1rem;
    position: relative;
  }
  .depo-card::before {
    content: '"';
    position: absolute;
    top: .5rem; left: 1rem;
    font-size: 3.5rem;
    color: var(--ouro);
    font-family: Georgia, serif;
    line-height: 1;
    opacity: .35;
  }
  .depo-text { font-size: .88rem; color: var(--texto); line-height: 1.7; font-style: italic; padding-left: .5rem; margin-bottom: .9rem; }
  .depo-meta { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .5rem; }
  .depo-mun { font-size: .78rem; font-weight: 700; color: var(--azul-medio); }
  .depo-sol { font-size: .72rem; color: var(--texto-leve); }
  .depo-stars { display: flex; gap: 2px; }
  .depo-star { font-size: .9rem; color: #E5E7EB; }
  .depo-star.on { color: var(--ouro); }
  .depo-notas {
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
    margin-top: .5rem;
    padding-top: .5rem;
    border-top: 1px solid var(--cinza-borda);
  }
  .depo-nota-chip { font-size: .7rem; background: var(--branco); border: 1px solid var(--cinza-borda); border-radius: 999px; padding: .15rem .55rem; color: var(--texto-leve); }
  .depo-nota-chip strong { color: var(--texto); }
  .no-depo { text-align: center; padding: 2rem; color: var(--texto-leve); font-size: .88rem; }
  .no-depo div { font-size: 1.8rem; margin-bottom: .5rem; }

  /* card click cursor */
  .sol-card { cursor: pointer; }
  .sol-card:hover .card-nome { text-decoration: underline; text-underline-offset: 3px; }

  /* modal scrollbar */
  .modal-box::-webkit-scrollbar { width: 5px; }
  .modal-box::-webkit-scrollbar-track { background: transparent; }
  .modal-box::-webkit-scrollbar-thumb { background: var(--cinza-borda); border-radius: 3px; }
  .modal-body::-webkit-scrollbar { width: 5px; }
  .modal-body::-webkit-scrollbar-track { background: transparent; }
  .modal-body::-webkit-scrollbar-thumb { background: var(--cinza-borda); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="logo-badge">MG GOV</div>
  <div>
    <h1>Marketplace de GovTechs</h1>
    <p>Programa Cidades do Futuro — Minas Gerais</p>
  </div>
  <div class="header-right" id="header-stats"></div>
</header>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal-box" id="modalBox">
    <div class="modal-head" id="modalHead">
      <button class="modal-close" onclick="closeModal()">✕</button>

": "Sociocultural", "Tópicos": "Saúde", "Descrição": "Plataforma de integração de dados de Saúde do Paciente com as Entidades de Atendimento à Saúde. Começamos pelo módulo “Resgate” (HPP, Alergias, Tratamento), Cartão Vacinação Criança e PET. Em desenvolvimento: Geolocalização, Propagação de doenças, Mapeamento de Processos em parceria com Secretarias Saúde (ESF) e Educação (creches)"}, {"Solução": "A Recreativa/MIA", "Versão resumida (Atualizada)": "A MIA é uma assistente digital com Inteligência Artificial que ajuda educadores a criar planos de aula personalizados, alinhados à BNCC e ao contexto dos alunos. Ela também desenvolve sequências didáticas, adapta atividades conforme as dificuldades de aprendizado e oferece roteiros personalizados.", "Impacto esperado": "Melhoria do aprendizado, redução da evasão escolar e aumento do rendimento dos alunos.", "Vídeo": "https://www.youtube.com/watch?v=U4ig0NpRJWI", "Site": "https://educacao.arecreativa.com.br/mia", "Dimensão": "Sociocultural", "Tópicos": "Educação", "Descrição": "MIA é uma assistente digital que põe a Inteligência Artificial a serviço da educação, economizando tempo e melhorando o ensino. A IA da MIA cria rapidamente planos de aula personalizados com base na BNCC e no contexto, produz sequências didáticas articuladas, adapta atividades com base em dificuldades de aprendizado e guia estudantes com roteiros sob medida\n- Gera plano de aula personalizados em minutos;\n- Criação de sequências didátivas para condução do aprendizado;\n- Atividades adaptadas para dificuldades de aprendizagem de alunos"}, {"Solução": "eArbo", "Versão resumida (Atualizada)": "O e-ARBO é um sistema de gestão de florestas urbanas que utiliza um aplicativo para inventário florestal, fornecendo dados estratégicos para municípios. Facilita o planejamento urbano sustentável com avaliação da vegetação via IA, análise fitossanitária e cálculo da quantidade de carbono assimilado.", "Impacto esperado": "Gestão sustentável da arborização urbana e redução de riscos.", "Vídeo": "https://www.youtube.com/watch?v=8hcJHRLxOWA", "Site": "https://ctcsolucoesflorestais.com.br/", "Dimensão": "Meio Ambiente", "Tópicos": "Áreas verdes", "Descrição": "O e-ARBO é um sistema de gestão de florestas urbanas que utiliza um aplicativo para elaboração do inventário florestal gerando informações estratégicas aos municípios. O software é de fácil utilização e manuseio, com custo operacional coerente ao tamanho e perfil dos municípios, alinhando ao conceito de cidades inteligentes e já desenhando para cálculos de carbono. Esta solução facilitará um planejamento urbano a partir de um diagnóstico de florestas urbanas, possibilitando intervenções que vão impactar positivamente na qualidade do ambiente. \n\n-Permite avaliar a vegetação arborea por meio de IA (evitando possíveis transtornos)\n- Análise Fitossanitária\n- Levanta a quantidade de carbono assimilado;"}, {"Solução": "SIBLAM", "Versão resumida (Atualizada)": "O SIBLAM é um sistema online que agiliza e padroniza o licenciamento ambiental com segurança jurídica e técnica, eliminando o uso de papel. Permite armazenar e organizar documentos de forma segura, seguindo a Resolução CONAMA 237/1997 e garantindo eficiência no funcionamento do órgão responsável.", "Impacto esperado": "Melhoria da conformidade ambiental e agilidade no licenciamento.", "Vídeo": "https://www.youtube.com/watch?v=7XHopEg6aLM", "Site": "https://tuxtu.com.br/siblam/", "Dimensão": "Meio Ambiente", "Tópicos": "Áreas verdes", "Descrição": "O Sistema Brasileiro de Licenciamento Ambiental (SIBLAM) é um software que opera 100% online e proporciona padronização e celeridade ao procedimento de licenciamento ambiental, com segurança jurídica e técnica, sem uso de papel. Ele permite anexar e armazenar, de forma segura, todos os documentos envolvidos no processo, organizando e otimizando o funcionamento do órgão responsável. Suas etapas atendem à Resolução 237/1997 do CONAMA e utilizam o Método Quantitativo de Indicadores (MQI) também conhecido como método Battelle (EES Enviromental Evaluation System)."}, {"Solução": "SIGAU", "Versão resumida (Atualizada)": "O Sistema de Gestão de Arborização Urbana permite aos gestores públicos cadastrar, atualizar e gerenciar dados sobre árvores e áreas verdes, facilitando o planejamento de intervenções e emissão de relatórios. Cidadãos podem solicitar licenças para poda ou remoção diretamente pelo sistema, que também identifica rapidamente árvores que necessitam de cuidados e gera indicadores para apoiar a gestão.", "Impacto esperado": "Ordenamento territorial e maior controle sobre o crescimento urbano.", "Vídeo": "", "Site": "https://tuxtu.com.br/sigau/", "Dimensão": "Meio Ambiente", "Tópicos": "Áreas verdes", "Descrição": "O Sistema de Gestão de Arborização Urbana é um programa que permite aos gestores públicos cadastrarem, atualizarem e gerenciarem dados de áreas verdes e de todas as árvores plantadas na cidade, possibilitando a emissão de relatórios e índices qualitativos e quantitativos de arborização, bem como planejar prioridades de intervenção. \n\n- O cidadão pode solicitar a licença ambiental de poda ou remoção de árvore feito pelo sistema;\n- Possibilita cadastramento de árvores e áreas verdes;\n- Identifica mais rápido árvores que precisam de remoção, poda ou tratamentos silviculturais;\n- O sistema gera resultados preliminares através dos relatórios e índices;"}, {"Solução": "ZAAZ", "Versão resumida (Atualizada)": "Digitalização de comércios locais para o mercado digital, possibilitando a venda de seus produtos nos principais marketplaces do mercado ou em até seu site próprio. Integração das contas na Shopee, Americanas, Mercado Livre e Magazine Luiza.", "Impacto esperado": "Aumento da arrecadação e recuperação de créditos em dívida ativa.", "Vídeo": "", "Site": "https://zaazonline.com/", "Dimensão": "Econômica", "Tópicos": "Inovação", "Descrição": "Digitalizaçãos de comércios locais para o mercado\ndigital, possibilitando a function fmtMoney(v) {
  const n = parseFloat(v.toString().replace('R$','').replace('.','').replace(',','.').trim());
  if (isNaN(n)) return v;
  return 'R$ ' + n.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

function normalize(s) { return (s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function getAvaliacao(municipio, solucao) {
  const mNorm = normalize(municipio);
  const sNorm = normalize(solucao);
  return AVALIACOES.find(a => normalize(a.municipio) === mNorm && (normalize(a.solucao).includes(sNorm) || sNorm.includes(normalize(a.solucao).split(' ')[0])));
}

function starsHTML(media) {
  let h = '';
  for (let i = 1; i <= 5; i++) h += `<span class="star ${i <= Math.round(media) ? 'on' : ''}">★</span>`;
  return h;
}

function dimClass(dim) {
  const d = normalize(dim||'');
  if (d.includes('econ')) return 'dim-economica';
  if (d.includes('instit') || d.includes('capacid')) return 'dim-institucional';
  if (d.includes('social') || d.includes('cultura')) return 'dim-sociocultural';
  if (d.includes('amb')) return 'dim-ambiente';
  return 'dim-outro';
}

function renderMarkers(filterSol) {
  allMarkers.forEach(m => map.removeLayer(m));
  allMarkers = [];

  Object.entries(byMun).forEach(([mun, resgates]) => {
    const coords = GEOCODES[mun];
    if (!coords) return;
    const filtered = filterSol ? resgates.filter(r => normalize(r['Solução']) === normalize(filterSol)) : resgates;
    if (!filtered.length) return;

    const hasAval = filtered.some(r => r['Avaliado'] === 'Sim');
    const icon = hasAval ? iconAval : iconTec;

    // Slight jitter for multiple markers in same city
    const lat = coords[0] + (Math.random()-.5)*.03;
    const lng = coords[1] + (Math.random()-.5)*.03;

    const marker = L.marker([lat, lng], { icon });
    marker.bindPopup(L.popup({ maxWidth: 310, minWidth: 300 }).setContent(buildPopupContent(mun, filtered)));
    marker.addTo(map);
    allMarkers.push(marker);
  });
}

function openModal(solNome) {
  const sol = SOLUCOES.find(s => s['Solução'] === solNome);

  const nome = sol['Solução'];
  const dim = sol['Dimensão']?.trim() || '';
  const topico = sol['Tópicos']?.trim() || '';
  // Use Descrição (rich) with fallback; escape HTML entities then restore newlines as <br>
  const rawDesc = (sol['Descrição'] || sol['Versão resumida (Atualizada)'] || '').trim();
  const desc = rawDesc.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  const impacto = (sol['Impacto esperado'] || '').trim();
  const site = sol['Site']?.trim() || '';
  const video = sol['Vídeo']?.trim() || '';

  // municipalities for this solution
  const resgatesForSol = RESGATES.filter(r => normalize(r['Solução'].trim()) === normalize(nome));
  const munsUniq = [...new Set(resgatesForSol.map(r => r['Município'].trim()))];
  const totalVal = resgatesForSol.reduce((s, r) => {
    const n = parseFloat(r['Valor'].toString().replace('R$','').replace(',','.').trim());
    return s + (isNaN(n) ? 0 : n);
  }, 0);

  // depoimentos for this solution
  const depos = AVALIACOES.filter(a => {
    const sNorm = normalize(a.solucao);
    const nNorm = normalize(nome);
    return sNorm.includes(nNorm.split(' ')[0]) || nNorm.includes(sNorm.split(' ')[0]);
  });

  // populate header
  document.getElementById('modalEye').textContent = dim || 'Solução GovTech';
  document.getElementById('modalTitle').textContent = nome;
  const topicoEl = document.getElementById('modalTopico');
  topicoEl.textContent = topico;
  topicoEl.style.display = topico ? 'inline-block' : 'none';

  // stats row removed — no longer shown

  // show/hide tabs based on data availability
  const tabMapaBtn = document.getElementById('tabMapaBtn');
  const tabDepoBtn = document.getElementById('tabDepoBtn');
  tabMapaBtn.style.display = munsUniq.length ? '' : 'none';
  tabDepoBtn.style.display = depos.length ? '' : 'none';

  // impacto
  const impEl = document.getElementById('modalImpacto');
  if (impacto) {
    impEl.style.display = 'block';
    document.getElementById('modalImpactoTxt').textContent = impacto;
  } else { impEl.style.display = 'none'; }

  // desc — use innerHTML so line breaks (<br>) in Descrição field render correctly
  document.getElementById('modalDesc').innerHTML = desc;

  // links
  let linksHtml = '';
  if (site) linksHtml += `<a class="modal-link site" href="${site}" target="_blank">🌐 Acessar site</a>`;
  if (video) linksHtml += `<a class="modal-link video" href="${video}" target="_blank">▶ Assistir vídeo</a>`;
  document.getElementById('modalLinks').innerHTML = linksHtml;

  // muns info in info tab
  if (munsUniq.length) {
    document.getElementById('modalMunsInfo').innerHTML = `
      <div style="font-size:.72rem;color:var(--texto-leve);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:.5rem">Municípios com implantação</div>
      <div style="display:flex;flex-wrap:wrap;gap:.35rem">
        ${munsUniq.map(m => {
          const hasAv = depos.some(d => normalize(d.municipio) === normalize(m));
          return `<span class="modal-mun-chip ${hasAv?'avaliado':''}">${hasAv?'⭐ ':''}${m}</span>`;
        }).join('')}
      </div>`;
  } else {
    document.getElementById('modalMunsInfo').innerHTML = '';
  }

  // depoimentos tab
  const depoContainer = document.getElementById('modalDepos');
  if (depos.length) {
    depoContainer.innerHTML = depos.map(d => `
      <div class="depo-card">
        <p class="depo-text">${d.depoimento}</p>
        <div class="depo-meta">
          <div>
            <div class="depo-mun">📍 ${d.municipio}</div>
            <div class="depo-sol">${d.solucao}</div>
          </div>
          <div style="text-align:right">
            <div class="depo-stars">${[1,2,3,4,5].map(i=>`<span class="depo-star ${i<=Math.round(d.media)?'on':''}">★</span>`).join('')}</div>
            <div style="font-family:'DM Mono',monospace;font-weight:700;color:var(--azul);font-size:.9rem">${d.media.toFixed(1)} / 5.0</div>
          </div>
        </div>
        <div class="depo-notas">
          <span class="depo-nota-chip">Atendimento: <strong>${d.nota1}/5</strong></span>
          <span class="depo-nota-chip">Facilidade: <strong>${d.nota2}/5</strong></span>
          <span class="depo-nota-chip">Treinamento: <strong>${d.nota3}/5</strong></span>
          <span class="depo-nota-chip">Ganhos: <strong>${d.nota4}/5</strong></span>

      </div>`).join('');
  } else {
    depoContainer.innerHTML = `<div class="no-depo"><div>💬</div>Nenhum depoimento registrado ainda para esta solução.</div>`;
  }

  // mun list in map tab
  document.getElementById('modalMunList').innerHTML = munsUniq.map(m => {
    const hasAv = depos.some(d => normalize(d.municipio) === normalize(m));
    return `<span class="modal-mun-chip ${hasAv?'avaliado':''}">${hasAv?'⭐ ':''}${m}</span>`;
  }).join('');

  // reset tabs — always start on info
  document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.modal-panel').forEach(p => p.classList.remove('active'));
  document.querySelector('.modal-tab').classList.add('active');
  document.getElementById('tab-info').classList.add('active');

  // open overlay
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  // build modal map (deferred to allow DOM paint)
  setTimeout(() => buildModalMap(munsUniq, depos, nome), 80);
}

function buildModalMap(munsUniq, depos, solNome) {
  if (modalMapInstance) {
    modalMapInstance.remove();
    modalMapInstance = null;
  }
  const mapEl = document.getElementById('modal-map');
  mapEl.innerHTML = '';

  modalMapInstance = L.map('modal-map', { zoomControl: true, scrollWheelZoom: false }).setView([-19.5, -44.5], 6);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', subdomains: 'abcd', maxZoom: 19
  }).addTo(modalMapInstance);

  const bounds = [];
  munsUniq.forEach(mun => {
    const coords = GEOCODES[mun];
    if (!coords) return;
    const hasAv = depos.some(d => normalize(d.municipio) === normalize(mun));
    const color = hasAv ? '#F5A623' : '#1B4F8A';
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:14px;height:14px;background:${color};border:2.5px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.35)"></div>`,
      iconSize: [14,14], iconAnchor: [7,7], popupAnchor: [0,-10]
    });

    // find resgate for this mun
    const r = RESGATES.find(x => x['Município'].trim() === mun && normalize(x['Solução'].trim()) === normalize(solNome));
    const av = depos.find(d => normalize(d.municipio) === normalize(mun));

    let popHtml = `<div style="font-size:.78rem;font-weight:700;color:#0A2342;margin-bottom:.3rem">📍 ${mun}</div>`;
    if (r) popHtml += `<div style="font-size:.75rem;color:#5E7896">Valor: <strong style="color:#0A2342;font-family:monospace">${fmtMoney(r['Valor'])}</strong></div>`;
    if (r) popHtml += `<div style="font-size:.75rem;color:#5E7896">Início: ${r['Data de início']}</div>`;
    if (av) {
      popHtml += `<div style="margin-top:.4rem;font-size:.75rem;color:#92600A;font-weight:600">⭐ Avaliação: ${av.media.toFixed(1)}/5</div>`;
      popHtml += `<div style="font-size:.72rem;font-style:italic;margin-top:.3rem;color:#444;max-width:200px">"${av.depoimento.slice(0,100)}…"</div>`;
    }

    const marker = L.marker(coords, { icon });
    marker.bindPopup(popHtml, { maxWidth: 230 });
    marker.addTo(modalMapInstance);
    bounds.push(coords);
  });

  if (bounds.length > 1) modalMapInstance.fitBounds(bounds, { padding: [30,30] });
  else if (bounds.length === 1) modalMapInstance.setView(bounds[0], 9);

  setTimeout(() => modalMapInstance.invalidateSize(), 150);
}

  const nome = normalize(document.getElementById('filterNome').value);
  const filtered = SOLUCOES.filter(s => {
    if (dim && normalize(s['Dimensão']||'') !== normalize(dim)) return false;
    if (tipo && normalize(s['Tópicos']||'') !== normalize(tipo)) return false;
    if (nome && !normalize(s['Solução']).includes(nome) && !normalize(s['Versão resumida (Atualizada)']||'').includes(nome)) return false;
    return true;
  });
  renderCatalog(filtered);
}

renderCatalog(SOLUCOES);
</script>
</body>
</html>
